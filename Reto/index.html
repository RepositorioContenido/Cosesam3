<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVA SENA</title>
  <meta name="description" content="Objeto Virtual de Aprendizaje (OVA) del SENA.">
  
  <!-- Tipografías: Work Sans (títulos) y Calibri del sistema (párrafos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css?v=20261024_1545">
  <link rel="stylesheet" href="css/ajustes.css?v=20261024_1550">
</head>
<body class="editorial-theme">
  <!-- Región anunciadora accesible para lectores de pantalla -->
  <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Contenedor Principal de la Experiencia -->
  <div class="ova-canvas" id="appCanvas">
    
    <!-- Capa de Textura Animada e Interactiva de Fondo -->
    <div class="interactive-bg-texture" id="bgInteractiveTexture" aria-hidden="true">
      <canvas id="bgTextureCanvas" class="bg-texture-canvas"></canvas>
      <div class="bg-cursor-glow" id="bgCursorGlow"></div>
      <div class="bg-texture-grain"></div>
    </div>
    
    <!-- MENÚ LATERAL (DINÁMICO: BLANCO EN PORTADA, AZUL EN MENÚ CARRUSEL) -->
    <aside class="purple-dock-nav theme-white" id="dockNav" aria-label="Menú lateral de acceso rápido">
      <!-- Silueta SVG de onda curva que se acopla a la pared izquierda -->
      <svg class="dock-curve-svg" viewBox="0 0 76 270" preserveAspectRatio="none" aria-hidden="true">
        <path id="dockCurvePath" d="M 0,0 C 0,38 72,32 72,70 L 72,200 C 72,238 0,232 0,270 Z" fill="#ffffff"/>
      </svg>
      
      <div class="dock-buttons-container">
        <!-- 1. Botón Home -->
        <button type="button" class="dock-btn dock-btn-home" id="btnDockHome" aria-label="Ir al inicio (Home)">
          <div class="dock-icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5z"/>
            </svg>
          </div>
          <span class="dock-tooltip">Home</span>
        </button>

        <!-- 2. Botón Créditos -->
        <button type="button" class="dock-btn" id="btnDockCredits" aria-label="Abrir Créditos del proyecto">
          <div class="dock-icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span class="dock-tooltip">Créditos</span>
        </button>

        <!-- 3. Botón Bibliografía -->
        <button type="button" class="dock-btn" id="btnDockBibliography" aria-label="Abrir Bibliografía y referencias">
          <div class="dock-icon-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="9" y1="7" x2="15" y2="7"></line>
              <line x1="9" y1="11" x2="15" y2="11"></line>
            </svg>
          </div>
          <span class="dock-tooltip">Bibliografía</span>
        </button>
      </div>
    </aside>

    <!-- ========================================================
         PANTALLA DE INICIO / PORTADA (Editorial Orbital con Parallax)
         ======================================================== -->
    <section class="portada-screen" id="portadaScreen" aria-label="Inicio o Portada de la unidad">
      <!-- Capa de Fondo con Imagen y Efecto Parallax interactivo -->
      <div class="portada-parallax-layer" id="portadaParallaxBg" aria-hidden="true">
        <div class="portada-bg-image"></div>
        <div class="portada-bg-overlay"></div>
      </div>

      <!-- Barra Superior con Logos -->
      <header class="portada-grid-header">
        <div class="p-header-cell cell-brand">
          <img alt="" class="portada-logo-foe">
        </div>
        <div class="p-header-cell cell-sena-right">
          <img alt="" class="portada-logo-sena">
        </div>
      </header>

      <!-- Capa Geométrica Vectorial: Líneas Arquitectónicas y Semicírculos de la Referencia -->
      <svg class="portada-vector-stage" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <!-- 1. Líneas de división arquitectónica y ejes de cuadrícula -->
        <g class="p-arch-lines" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2">
          <!-- Línea vertical izquierda -->
          <line x1="160" y1="0" x2="160" y2="800" />
          <!-- Línea vertical derecha -->
          <line x1="1280" y1="0" x2="1280" y2="800" />
          <!-- Línea horizontal inferior -->
          <line x1="0" y1="740" x2="1440" y2="740" />
          <!-- Línea horizontal de guía superior -->
          <line x1="160" y1="180" x2="1280" y2="180" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="3 6" />
        </g>

        <!-- 2. Cruces de intersección técnica (+) -->
        <g class="p-crosshairs" stroke="rgba(255, 255, 255, 0.42)" stroke-width="1.2">
          <line x1="154" y1="740" x2="166" y2="740" />
          <line x1="160" y1="734" x2="160" y2="746" />
          <line x1="1274" y1="740" x2="1286" y2="740" />
          <line x1="1280" y1="734" x2="1280" y2="746" />
          <line x1="154" y1="180" x2="166" y2="180" />
          <line x1="160" y1="174" x2="160" y2="186" />
          <line x1="1274" y1="180" x2="1286" y2="180" />
          <line x1="1280" y1="174" x2="1280" y2="186" />
        </g>

        <!-- 3. Semicírculos Izquierdos (Gran arco circular y satélites) -->
        <g class="p-left-arcs">
          <!-- Gran semicírculo exterior continuo -->
          <circle cx="0" cy="400" r="320" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.4" />
          <!-- Semicírculo secundario punteado orbital -->
          <circle cx="0" cy="400" r="220" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" stroke-dasharray="5 7" />
          <!-- Arco interno fino de precisión -->
          <circle cx="0" cy="400" r="130" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
          <!-- Nodos satelitales en la trayectoria -->
          <circle cx="226" cy="174" r="4.5" fill="#094bcb" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="320" cy="400" r="3.5" fill="#39a900" stroke="#ffffff" stroke-width="1.2" />
          <circle cx="226" cy="626" r="4" fill="#28bab8" stroke="#ffffff" stroke-width="1.5" />
        </g>

        <!-- 4. Semicírculos Derechos (Radar Orbital Concéntrico) -->
        <g class="p-right-arcs">
          <!-- Semicírculo exterior continuo -->
          <circle cx="1440" cy="400" r="460" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.4" />
          <!-- Gran arco radar punteado concéntrico -->
          <circle cx="1440" cy="400" r="340" fill="none" stroke="rgba(255, 255, 255, 0.24)" stroke-width="1.4" stroke-dasharray="8 8" />
          <!-- Arco interior continuo de guía -->
          <circle cx="1440" cy="400" r="230" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
          <!-- Rayos radiales de escaneo técnico -->
          <line x1="1440" y1="400" x2="1145" y2="230" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="3 5" />
          <line x1="1440" y1="400" x2="1145" y2="570" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="3 5" />
          <!-- Nodos orbitales con aros de radar -->
          <circle cx="1100" cy="400" r="4" fill="#ffffff" />
          <circle cx="1100" cy="400" r="10" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" />
          <circle cx="1145" cy="230" r="4" fill="#39a900" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="1145" cy="570" r="4" fill="#28bab8" stroke="#ffffff" stroke-width="1.5" />
        </g>
      </svg>

      <!-- Escenario Principal Centrado -->
      <div class="portada-stage-grid">
        
        <!-- Botón de acceso directo en la esquina inferior izquierda -->
        <div class="portada-left-col">
          <button type="button" class="btn-p-circle-arrow" id="btnPortadaScroll" aria-label="Ingresar al Menú carrusel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>
          </button>
        </div>

        <!-- Centro: Lente Circular con CTA -->
        <div class="portada-center-col">
          <div class="portada-glass-orb" id="portadaGlassOrb">
            <!-- Contenido Central del Lente -->
            <div class="orb-inner-content">
              <span class="orb-unit-label" id="portadaUnitLabel"></span>
              <h1 class="orb-hero-title" id="portadaHeroTitle"></h1>

              <!-- Botón Principal "Comenzar" con Partículas Interactivas -->
              <div class="orb-cta-wrap">
                <canvas class="cta-particles-canvas" id="ctaParticlesCanvas" aria-hidden="true"></canvas>
                <button type="button" class="btn-enter-carrusel-pill" id="btnEnterCarrusel" aria-label="Comenzar">
                  <span class="btn-pill-label">Comenzar</span>
                  <span class="btn-pill-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M7 17L17 7M7 7h10v10"/>
                    </svg>
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ========================================================
         SECCIÓN MENÚ CARRUSEL (Header, Barra superior, Stage y Footer)
         ======================================================== -->
    <div class="menu-carrusel-section is-hidden" id="menuCarruselSection">
      <!-- Barra de progreso lineal continua ubicada en la parte superior (sin textos) -->
      <div class="header-progress-line" role="progressbar" aria-label="Progreso general de la unidad" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
        <div class="header-progress-fill" id="headerProgressBar" style="width: 20%;"></div>
      </div>

    <!-- ZONA A: Encabezado Discreto -->
    <header class="editorial-header" role="banner">
      <div class="header-left">
        <a href="#main-content" class="skip-to-content sr-only sr-only-focusable">Saltar al contenido principal</a>
        <!-- Logo FOE a la izquierda -->
        <img alt="" class="header-logo-foe">
        <div class="header-divider" aria-hidden="true"></div>
        <div class="header-brand">
          <span class="unit-badge" id="headerUnitBadge"></span>
        </div>
        <div class="course-meta">
          <h1 class="course-title" id="headerCourseTitle"></h1>
        </div>
      </div>

      <div class="header-right">
        <!-- Logo SENA a la derecha -->
        <img alt="" class="header-logo-sena">
      </div>
    </header>

    <!-- ZONAS B & C: Lienzo Principal Editorial y Carrusel Circular -->
    <main id="main-content" class="editorial-stage">
      
      <!-- Retícula geométrica de fondo -->
      <div class="grid-watermark" aria-hidden="true">
        <div class="grid-line grid-line-v1"></div>
        <div class="grid-line grid-line-v2"></div>
        <div class="grid-line grid-line-h1"></div>
      </div>

      <!-- ZONA C: imagen central del menú (heroImage en content.json) -->
      <section class="editorial-overview" aria-label="Visual del recurso seleccionado">
        
        <!-- Imagen destacada de la Unidad (única, estática) -->
        <div class="editorial-circular-frame" aria-label="Imagen destacada de la unidad">
          <img id="editorialCircularImg" alt="" class="circular-theme-img">
        </div>
      </section>

      <!-- ZONA B: carrusel de recursos (lo dibuja js/carousel.js) -->
      <section class="circular-carousel-wrapper" aria-label="Carrusel circular de recursos" id="carouselWrapper">
        
        <!-- Arco o círculo del carrusel y línea animada entre botones -->
        <svg class="wove-track-svg" id="woveTrackSvg" aria-hidden="true">
          <defs>
            <!-- Degradado de la línea animada entre botones -->
            <linearGradient id="senaNavArcGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#28bab8" stop-opacity="0" />
              <stop offset="12%" stop-color="#28bab8" stop-opacity="0.35" />
              <stop offset="28%" stop-color="#28bab8" stop-opacity="1" />
              <stop offset="44%" stop-color="#174d93" stop-opacity="1" />
              <stop offset="50%" stop-color="#0c334c" stop-opacity="1" />
              <stop offset="56%" stop-color="#174d93" stop-opacity="1" />
              <stop offset="72%" stop-color="#28bab8" stop-opacity="1" />
              <stop offset="88%" stop-color="#28bab8" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#28bab8" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path id="woveArcPath" class="wove-arc-line" d="" />
          <!-- Línea animada que une los botones usando el degradé -->
          <path id="woveNavTransitionPath" class="wove-nav-transition-line" d="" />
        </svg>

        <!-- Botones de los recursos -->
        <div class="wove-nodes-container" id="wheelNodesContainer">
          <!-- Inyectados por carousel.js -->
        </div>

      </section>

      <!-- Logos institucionales en la esquina inferior derecha del menú
           (mismas imágenes que el pie de los popups: branding.popupLogoLeft / popupLogoRight) -->
      <div class="menu-brand-logos">
        <img alt="" class="popup-logo-left">
        <img alt="" class="popup-logo-right">
      </div>

    </main>

    <!-- Pie de página con franja verde institucional -->
    <footer class="editorial-footer">
      <p class="footer-legal-notice"></p>
    </footer>
    </div> <!-- Fin #menuCarruselSection -->
  </div> <!-- Fin #appCanvas -->

  <!-- ZONA D2: modal de recursos (3 columnas) -->
  <div class="wove-modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalResourceTitle" hidden>
    <div class="wove-modal-backdrop" id="modalBackdrop"></div>

    <div class="rams-modal-wrapper">
      
      <!-- Barra superior externa del modal -->
      <div class="rams-modal-topbar">
        <div class="topbar-left">
          <span class="topbar-date" id="modalTopDate"></span>
          <span class="topbar-sep">•</span>
          <span class="topbar-course" id="modalTopCourse"></span>
        </div>
        <div class="topbar-right">
          <button type="button" class="rams-close-btn" id="btnModalClose" aria-label="Cerrar modal (Escape)">
            ✕
          </button>
        </div>
      </div>

      <!-- Tarjeta principal del modal -->
      <div class="rams-modal-container" id="modalContainer" tabIndex="-1">
        <div class="rams-modal-grid" id="ramsModalGrid">
          
          <!-- ========================================================
               COLUMNA 1: Imagen de apoyo (Izquierda)
               ======================================================== -->
          <div class="rams-col-media" id="ramsColMedia">
            <div class="col-media-frame">
              <img id="modalSupportImage" alt="" class="support-product-img">
            </div>
          </div>

          <!-- ========================================================
               COLUMNA 2: encabezado del recurso y slides
               ======================================================== -->
          <div class="rams-col-content" id="ramsColContent">
            
            <!-- Título tipográfico gigante estilo PC-4960 -->
            <div class="rams-title-section">
              <div class="rams-label-badge" id="modalLabelBadge"></div>
              <h2 class="rams-huge-code" id="modalHugeCode">
                <span class="code-solid" id="modalCodeSolid"></span><span class="code-outline" id="modalCodeOutline"></span>
              </h2>
              <h3 class="rams-subtitle-text" id="modalResourceTitle"></h3>
            </div>

            <!-- Slides del recurso (las dibuja js/slides-engine.js) -->
            <div class="modal-slides-container" id="modalSlidesContainer">
              <!-- Renderizado dinámicamente por ModalSlidesEngine -->
            </div>

          </div>

          <!-- ========================================================
               COLUMNA 3: Subtemas / Slides (Derecha - Navegación por tabs)
               ======================================================== -->
          <aside class="rams-col-subtopics" id="ramsColSubtopics" aria-label="Secciones del recurso">
            <div class="subtopics-header">
              <span class="subtopics-title" id="subtopicsHeaderTitle">SECCIONES</span>
            </div>
            
            <div class="subtopics-list" id="modalSubtopicsList">
              <!-- Inyectado dinámicamente con las pestañas de las slides -->
            </div>
          </aside>

        </div>
      </div>
    </div>
  </div>


  <!-- MODAL POPUP VINTAGE TIPO AMIE CALENDAR (Para Créditos y Bibliografía) -->
  <div class="amie-popup-overlay" id="amiePopupOverlay" role="dialog" aria-modal="true" aria-labelledby="amiePopupTitle" hidden>
    <div class="amie-popup-backdrop" id="amiePopupBackdrop"></div>

    <div class="amie-postcard-wrapper" id="amiePostcardWrapper">
      <article class="amie-postcard-card" id="amiePostcardCard">
        
        <!-- Barra superior con botón de cierre -->
        <header class="amie-card-header">
          <button type="button" class="amie-close-btn" id="btnAmieClose" aria-label="Cerrar modal">
            ✕
          </button>
        </header>

        <!-- Cuerpo de la postal en 2 columnas -->
        <div class="amie-card-grid">
          
          <!-- Columna 1 (Izquierda): Tarjetas flotantes -->
          <div class="amie-left-column" id="amieLeftColumn">
            <div class="amie-left-stickers" id="amieLeftStickers">
              <!-- Inyectado dinámicamente -->
            </div>
          </div>

          <!-- Columna 2 (Derecha): Información con scroll -->
          <div class="amie-right-column" id="amieRightColumn">
            <div class="amie-right-scroll-container" id="amieRightScrollContainer">
              <!-- Inyectado dinámicamente con Créditos o Bibliografía -->
            </div>
          </div>

        </div>

        <!-- Pie con los logos de la institución, centrados a todo el ancho -->
        <footer class="amie-popup-footer">
          <img alt="" class="amie-bottom-logo popup-logo-left">
          <img alt="" class="amie-bottom-logo popup-logo-right">
        </footer>

      </article>
    </div>
  </div>


  <!-- Toast de Notificación Discreta -->
  <div id="toastNotification" class="toast-notification" role="status" aria-live="polite" hidden>
    <div class="toast-icon">✓</div>
    <div class="toast-message" id="toastMessage">Cambios guardados con éxito</div>
  </div>

  <!-- Cursor Dinámico Interactivo SENA -->
  <div class="custom-cursor-dot" id="cursorDot" aria-hidden="true"></div>
  <div class="custom-cursor-follower" id="cursorFollower" aria-hidden="true">
    <span class="cursor-badge-text" id="cursorBadgeText"></span>
  </div>

  <!-- Scripts Modulares -->
  <script src="js/content.js?v=20261024_1540"></script>
  <script src="js/data.js?v=20261024_1600"></script>
  <script src="js/bg-texture.js?v=20261024_1600"></script>
  <script src="js/carousel.js?v=20261024_1600"></script>
  <script src="js/slides-engine.js?v=20261024_1600"></script>
  <script src="js/modal.js?v=20261024_1600"></script>
  <script src="js/app.js?v=20261024_1540"></script>
  <script src="js/cursor.js?v=20261024_1600"></script>
</body>
</html>
